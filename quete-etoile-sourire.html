<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Quête de l'Étoile-Sourire</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--n:#22194d;--p:#fff6df;--o:#ffb703;--g:#3f9e5a;--r:#e85c3a}
*{box-sizing:border-box}
body{margin:0;background:var(--n);color:#2b2140;font:500 19px/1.5 "Baloo 2","Comic Sans MS",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:640px;padding:12px}
.card{background:var(--p);border-radius:22px;padding:14px;border:4px solid var(--o)}
svg{width:100%;height:auto;border-radius:14px;display:block}
h1{font-size:34px;line-height:1.1;margin:.3em 0;color:var(--r);text-align:center}
h2{margin:.4em 0;font-size:24px}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 16px;background:var(--g);color:#fff;cursor:pointer;margin:5px 0;width:100%;text-align:left}
button:focus-visible,input:focus-visible{outline:4px solid var(--o)}
.b2{background:var(--n);width:auto;margin:6px 4px 0 0}
.bar{display:flex;justify-content:space-between;color:#fff;padding:4px 6px 8px;font-size:22px}
.d{display:flex;flex-wrap:wrap;gap:6px}.d button{width:52px;text-align:center;padding:10px 0;background:var(--o);color:var(--n)}
.msg{background:#fff;border-radius:14px;padding:10px;margin:8px 0}
.end{text-align:center;font-size:22px}
input{font:inherit;padding:10px;border-radius:12px;border:3px solid var(--o);width:100%}
@media(prefers-reduced-motion:no-preference){.pop{animation:p .4s}@keyframes p{from{transform:scale(.94);opacity:0}}}
</style></head><body><div id="app"></div><script>
const $=q=>document.querySelector(q);let nm='Héros',S,V,K,seen=[];
try{seen=JSON.parse(localStorage.fins||'[]')}catch(e){}
const f=s=>s.replaceAll('{n}',nm);
// ---- Illustrations : mêmes personnages et mêmes couleurs partout ----
const C={
h:`<path d="M-14 0H14L18 34H-18Z" fill="#d9483b"/><rect x="-10" y="6" width="20" height="28" rx="8" fill="#3b78c4"/><circle cy="-6" r="13" fill="#f5c9a0"/><path d="M-13 -8Q0 -26 13 -8Q0 -14 -13 -8Z" fill="#7a4a21"/><circle cx="-4" cy="-5" r="1.7" fill="#222"/><circle cx="4" cy="-5" r="1.7" fill="#222"/><path d="M-3 1Q0 4 3 1" stroke="#222" fill="none"/><rect x="14" y="8" width="3" height="24" fill="#ccd"/>`,
d:`<rect x="-11" y="8" width="22" height="24" rx="8" fill="#8a5a2b"/><circle cy="-2" r="12" fill="#f0b98d"/><path d="M-12 2Q0 34 12 2Q0 10 -12 2Z" fill="#e2731f"/><path d="M-13 -6Q0 -24 13 -6Z" fill="#9aa5b1"/><circle cx="-4" cy="-3" r="1.7" fill="#222"/><circle cx="4" cy="-3" r="1.7" fill="#222"/>`,
f:`<ellipse cx="-12" rx="10" ry="6" fill="#bff" opacity=".85"/><ellipse cx="12" rx="10" ry="6" fill="#bff" opacity=".85"/><circle cy="-2" r="7" fill="#f7d1e6"/><path d="M-5 5H5L2 18H-2Z" fill="#e85fa5"/><circle cx="-2.5" cy="-3" r="1" fill="#222"/><circle cx="2.5" cy="-3" r="1" fill="#222"/><text y="-11" font-size="10" text-anchor="middle">✨</text>`,
g:`<path d="M-30 20Q-55 20 -50 0Q-40 12 -28 8Z" fill="#3f9e5a"/><ellipse rx="34" ry="24" fill="#4fb26b"/><ellipse cy="8" rx="20" ry="14" fill="#f3e39a"/><path d="M-10 -20Q-30 -60 -50 -30Q-30 -30 -20 -10Z" fill="#2f8a4b"/><circle cx="30" cy="-18" r="16" fill="#4fb26b"/><circle cx="36" cy="-22" r="3" fill="#fff"/><circle cx="37" cy="-22" r="1.5" fill="#222"/><path d="M28 -10Q36 -5 44 -11" stroke="#222" fill="none" stroke-width="1.5"/><path d="M20 -32L24 -42L30 -33ZM32 -33L38 -42L42 -30Z" fill="#e85c3a"/>`,
c:`<rect x="-14" y="0" width="28" height="18" rx="3" fill="#b9782e"/><rect x="-14" y="0" width="28" height="6" fill="#d99a3d"/><circle cy="8" r="2.5" fill="#ffd54a"/>`};
const B={
for:['#9edcff','#e8ffd6','#5fbf5a',`<circle cx="50" cy="38" r="20" fill="#fff3a0"/><rect x="238" y="85" width="10" height="55" fill="#8a5a2b"/><circle cx="243" cy="78" r="26" fill="#2f8a4b"/><rect x="18" y="100" width="8" height="40" fill="#8a5a2b"/><circle cx="22" cy="95" r="18" fill="#3f9e5a"/>`],
mou:['#b9a7ff','#ffd9e8','#7d8aa3',`<path d="M0 135L70 45L140 135ZM100 135L190 30L280 135Z" fill="#8d7fc9"/><path d="M190 30L172 58L190 52L206 60Z" fill="#fff"/>`],
cav:['#2a1f4d','#4b3a7a','#3a2d5c',`<path d="M20 0L30 40L40 0ZM250 0L262 50L275 0Z" fill="#6b58a8"/><path d="M215 135L225 105L235 135Z" fill="#7de0ff"/><path d="M40 135L48 115L56 135Z" fill="#ff8fd0"/>`],
fai:['#1b1660','#6a4fc7','#3c8f6a',`<g fill="#fff"><circle cx="30" cy="30" r="2"/><circle cx="90" cy="20" r="2"/><circle cx="160" cy="40" r="1.5"/><circle cx="240" cy="25" r="2"/><circle cx="270" cy="60" r="1.5"/></g><circle cx="255" cy="45" r="14" fill="#fff6b0"/>`],
sun:['#ffcf70','#ffefc2','#7fcf6b',`<circle cx="150" cy="70" r="40" fill="#fff3a0"/>`]};
function svg(a){const[b,...it]=a,[s1,s2,gr,dc]=B[b];return `<svg viewBox="0 0 300 180" role="img" aria-label="Illustration"><defs><linearGradient id="g${b}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs><rect width="300" height="180" fill="url(#g${b})"/>${dc}<rect y="135" width="300" height="45" fill="${gr}"/>${it.map(([k,x,y,s=1])=>C[k]?`<g transform="translate(${x} ${y}) scale(${s})">${C[k]}</g>`:`<text x="${x}" y="${y}" font-size="${s*30}" text-anchor="middle">${k}</text>`).join('')}</svg>`}
// ---- Histoire ----
const N={
s:{t:`Le village de Pomponville`,a:['for',['h',120,100,1.2],['f',200,60],['🏡',255,128,1.6]],x:`Ce matin, la Lune a perdu son Étoile-Sourire ! Sans elle, elle fait la tête et les nuits sont toutes tristes. Une petite fée, Lumi, tombe dans ta soupe : « {n} ! Il me faut un héros courageux… et c'est toi ! » Quel chemin choisis-tu ?`,c:[{l:`🌲 La forêt des champignons rebondissants`,g:'f'},{l:`⛰️ La montagne du Grand Ronflement`,g:'m'}]},
f:{t:`La forêt des champignons`,a:['for',['h',90,102,1.2],['f',150,60],['🍄',200,130,2.2],['🍄',260,130,1.6]],x:`Les champignons sont géants et ils bondissent ! Lumi rigole : « Boing ! Boing ! Ça chatouille les pieds ! » Au loin, des lucioles dansent en rond.`,c:[{l:`🍄 Sauter de champignon en champignon`,d:6,n:3,ok:'n',ko:'n',sm:`Boing boing boing ! Tu voles comme un kangourou !`,fm:`Boing… PATATRAC ! Tu atterris dans une flaque de confiture. Aïe !`,dh:-1},{l:`✨ Suivre les lucioles`,g:'r'}]},
m:{t:`La montagne du Grand Ronflement`,a:['mou',['h',80,102,1.2],['f',130,70],['🌉',215,128,2]],x:`Le vent souffle : « Ronfff… » C'est la montagne qui dort ! Devant toi, un pont de cordes qui danse la samba. Tu peux aussi entrer par une petite porte ronde.`,c:[{l:`🌉 Traverser le pont qui danse`,d:8,n:4,ok:'g',ko:'n',sm:`Tu danses avec le pont… et tu arrives de l'autre côté !`,fm:`Le pont éternue ! Tu tombes dans une mine, sur un coussin de barbes de nains.`},{l:`🚪 Entrer par la petite porte ronde`,g:'n'}]},
n:{t:`La mine des nains Barbe-Bleue`,a:['cav',['h',30,105,.9],['d',90,103,1.2],['d',160,103,1.2],['d',230,103,1.2]],x:`Trois nains font la fête ! Leurs barbes sont si longues qu'ils marchent dessus. « Un invité ! Un gâteau ! Une danse ! » crient-ils en se cognant les casques.`,c:[{l:`💃 Danser la gigue des nains`,d:10,n:5,ok:'g',ko:'g',gi:`🗝️ Clé de Pierre`,sm:`Bravo ! Les nains t'offrent la Clé de Pierre !`,fm:`Tu écrases trois orteils de nain. Ils rient, mais toi tu boites.`,dh:-1},{l:`🎂 Manger le gâteau géant`,g:'e2'},{l:`🗺️ Demander le chemin du dragon`,g:'g'}]},
r:{t:`Le royaume des fées`,a:['fai',['f',70,90,1.6],['f',150,60,1.6],['f',230,90,1.6],['h',150,102,1]],gi:`✨ Poussière d'Étoile`,x:`Ici, tout brille et sent le bonbon ! La Reine Nacre te sourit : « Prends ma Poussière d'Étoile, elle te fera voler ! » Au fond, un grand bal commence.`,c:[{l:`✨ Saupoudrer la poussière et s'envoler`,d:4,n:2,ok:'g',ko:'g',sm:`Tu voles comme un oiseau !`,fm:`Atchoum ! Tu voles à l'envers ! Mais tu arrives quand même.`},{l:`💃 Rester au grand bal des fées`,g:'e3'}]},
g:{t:`La grotte du dragon`,a:['cav',['c',245,118],['g',150,110,1.2],['h',50,102,.9],['⭐',178,90,.8]],x:`Dans la grotte, un bébé dragon vert dort sur un tas de pièces. Il serre dans ses pattes… l'Étoile-Sourire ! Il ronfle : « Ronfff-pouf ! » et fait des bulles de fumée.`,c:[{l:`🪶 Chatouiller doucement ses pieds`,d:4,n:2,ok:'y',ko:'y',sm:`Il rit dans son sommeil, puis ouvre un œil.`,fm:`Hatchoum ! Il éternue une flammèche qui roussit tes sourcils !`,dh:-1},{l:`🥷 Voler l'étoile sur la pointe des pieds`,d:20,n:12,ok:'e4',ko:'y',sm:`Chuuut ! Tu es un ninja parfait !`,fm:`CRAC ! Tu marches sur une pièce qui couine. Le dragon se réveille !`},{l:`🗝️ Ouvrir le coffre avec la Clé de Pierre`,it:'🗝️',g:'c'}]},
y:{t:`Flamèche se réveille`,a:['cav',['h',70,102,1.2],['f',115,55,.9],['g',195,110,1.2]],x:`Le dragon s'appelle Flamèche. Il te regarde avec des yeux tout ronds : « Je voulais juste… un ami pour jouer. Cette étoile est trop jolie ! » Il sent un peu la saucisse grillée.`,c:[{l:`😂 Lui raconter ta blague la plus drôle`,g:'e1'},{l:`🔥 Lancer un concours de rots de feu`,d:12,n:6,ok:'e5',ko:'e1',sm:`BROUAAAP ! Tu gagnes !`,fm:`Pfff… juste un petit hoquet. Mais Flamèche rit tellement qu'il devient ton ami !`}]},
c:{t:`Le coffre qui chante`,a:['cav',['h',60,102],['c',150,110,2.2],['🧦',215,120,1.2],['🧦',100,130,1]],x:`Le coffre chante : « Tralala, ouvre-moi ! » Dedans… des chaussettes ! Des rouges, des à pois, des qui sentent le fromage. Tout au fond, quelque chose brille.`,c:[{l:`🧦 Plonger la tête la première`,d:6,n:4,ok:'e4',ko:'e6',sm:`Tu attrapes l'Étoile-Sourire !`,fm:`Oups ! Le coffre se referme sur toi !`}]},
z:{e:1,t:`Sieste sous les étoiles`,a:['fai',['h',120,112,1.2],['f',190,70,1.2],['💤',165,95,1]],x:`Tu n'as plus de cœurs et tu bâilles très fort. Lumi te couvre de pétales : « Dors bien, {n}. Demain, tu auras trois cœurs tout neufs ! » Tu ronfles comme la montagne. Fin douce.`},
e1:{e:1,t:`L'Ami du Dragon`,a:['sun',['g',150,80,1.3],['h',150,25,.6],['🌙',250,45,1.4]],x:`Flamèche éclate de rire et te rend l'Étoile-Sourire ! Il t'emmène sur son dos jusqu'à la Lune. Elle sourit si fort que toutes les étoiles dansent. Bravo {n}, tu es le Héros de la Lune !`},
e2:{e:1,t:`Le Roi du Gâteau`,a:['cav',['d',80,103,1.2],['d',220,103,1.2],['🎂',150,125,2.4]],x:`Tu manges une part, puis dix. Tu deviens rond comme un ballon et tu roules jusqu'à la maison ! Les nains font de toi leur Roi du Gâteau. La Lune boude encore, mais toi tu es très content.`},
e3:{e:1,t:`Chevalier des Fées`,a:['fai',['f',80,70,1.6],['f',220,70,1.6],['h',150,102,1.3],['🦋',150,50,1]],x:`Tu danses toute la nuit ! La Reine te nomme Chevalier-Papillon. Avec des milliers de lucioles, les fées dessinent un nouveau sourire à la Lune. Elle rit aux éclats.`},
e4:{e:1,t:`Le Héros Ninja`,a:['sun',['h',110,102,1.3],['⭐',200,112,1.6],['🌙',250,40,1.2]],x:`Sans un bruit, tu rapportes l'Étoile-Sourire ! À la place, Flamèche a une chaussette-doudou et ronfle en souriant. La Lune est ravie. Chuuut, personne n'a rien vu !`},
e5:{e:1,t:`Le Champion du Rot de Feu`,a:['sun',['g',150,80,1.3],['h',150,25,.6],['🔥',245,110,1.4]],x:`BROUAAAP ! Flamèche est fou de joie : il te rend l'étoile et vous volez jusqu'à la Lune en faisant des rots arc-en-ciel ! Ça sent un peu le barbecue, mais c'est magique.`},
e6:{e:1,t:`Le Roi des Chaussettes`,a:['cav',['c',150,110,2.4],['🧦',60,125,1.6],['🧦',245,125,1.6],['h',150,45,.5]],x:`Le coffre te garde ! Tu deviens le Roi des Chaussettes, avec une couronne à pois. Les nains viennent te chercher en rigolant. Chaque nuit, la Lune te fait un clin d'œil.`}};
const TOT=Object.values(N).filter(n=>n.e).length;
// ---- Moteur ----
const bar=()=>`<div class="bar"><span>${'❤️'.repeat(S.hp)+'🤍'.repeat(Math.max(0,3-S.hp))}</span><span>🎒 ${S.it.join(' ')||'vide'}</span></div>`;
function cover(){$('#app').innerHTML=`<div class="card"><h1>La Quête de l'Étoile-Sourire</h1>${svg(['sun',['g',105,105,1.2],['h',205,100,1.2],['d',260,103],['f',165,45]])}<p style="text-align:center">Un livre dont tu es le héros !<br>🐉 Dragons · ⛏️ Nains · 🧚 Fées</p><label>Comment t'appelles-tu, héros ?<input id="nm" placeholder="Ton prénom"></label><p>🎲 Prends tes dés (d4, d6, d8, d10, d12, d20) ou lance-les sur l'écran. Une partie dure 15 à 30 min et il y a ${TOT} fins à découvrir.</p><button onclick="nm=($('#nm').value||'Héros').replace(/[<>&]/g,'');start()">⚔️ Commencer l'aventure</button></div>`}
function start(){S={hp:3,it:[]};go('s')}
function go(id){if(S.hp<=0)id='z';S.id=id;const n=N[id];if(n.gi&&!S.it.includes(n.gi))S.it.push(n.gi);
if(n.e&&!seen.includes(id)){seen.push(id);try{localStorage.fins=JSON.stringify(seen)}catch(e){}}
V=(n.c||[]).filter(c=>!c.it||S.it.some(x=>x.startsWith(c.it)));
$('#app').innerHTML=`<div id="bar">${bar()}</div><div class="card pop">${svg(n.a)}<h2>${n.t}</h2><p id="tx">${f(n.x)}</p><div id="ch">${n.e?`<div class="end">🏆 Fin : ${n.t}<br>Fins trouvées : ${seen.length}/${TOT}</div><button onclick="start()">🔄 Rejouer une autre aventure</button>`:V.map((c,i)=>`<button onclick="pick(${i})">${c.l}</button>`).join('')}</div><button class="b2" onclick="speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance($('#tx').textContent),{lang:'fr-FR'}))">🔊 Lire à voix haute</button><button class="b2" onclick="book()">📖 Mes fins</button><button class="b2" onclick="cover()">🏠</button></div>`;window.scrollTo(0,0)}
function pick(i){const c=V[i];if(!c.d)return go(c.g);K=c;$('#ch').innerHTML=`<div class="msg">🎲 Lance ton dé à <b>${c.d} faces</b> ! Il faut <b>${c.n}</b> ou plus. Tape le nombre obtenu :</div><div class="d">${Array.from({length:c.d},(_,k)=>`<button onclick="roll(${k+1})">${k+1}</button>`).join('')}</div><button onclick="roll(Math.ceil(Math.random()*K.d))">🎲 Lancer un dé virtuel</button>`}
function roll(r){const ok=r>=K.n,crit=r==K.d;if(!ok&&K.dh)S.hp+=K.dh;if(ok&&K.gi&&!S.it.includes(K.gi))S.it.push(K.gi);if(crit)S.hp=Math.min(5,S.hp+1);
$('#bar').innerHTML=bar();$('#ch').innerHTML=`<div class="msg pop">🎲 <b>${r}</b> — ${ok?'Réussi !':'Raté…'} ${crit?'🌟 Coup de génie ! +1 ❤️':''}<br>${ok?K.sm:K.fm}</div><button onclick="go('${ok?K.ok:K.ko}')">Continuer ▶</button>`}
function book(){alert(Object.entries(N).filter(([k,n])=>n.e).map(([k,n])=>(seen.includes(k)?'✅ ':'❓ ')+(seen.includes(k)?n.t:'???')).join('\n'))}
cover();
</script></body></html>
